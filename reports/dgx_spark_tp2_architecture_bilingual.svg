<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#020617;font-family:'JetBrains Mono',Menlo,'Segoe UI',sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.7"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Grid Background -->
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Outer Header -->
  <g transform="translate(40, 32)">
    <circle cx="10" cy="10" r="6" fill="#34d399"/>
    <circle cx="10" cy="10" r="10" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="32" y="15" fill="#f8fafc" font-size="18" font-weight="bold" letter-spacing="0.5">DGX SPARK TP=2 DUAL-NODE SERVING ARCHITECTURE</text>
    <text x="32" y="32" fill="#94a3b8" font-size="11">雙機分散式推論拓撲、安全工作竊取排程器與動態溫控變速箱架構 (Safe Work-Stealing, 2M Pool, MS-DTC)</text>
    <text x="1080" y="20" fill="#34d399" font-size="11" font-weight="bold" text-anchor="end">PRODUCTION CHAMPION (100% 200 OK)</text>
    <text x="1080" y="34" fill="#64748b" font-size="10" text-anchor="end">v2b2-p15-transcending-champion</text>
  </g>

  <!-- Section 1: Ingestion & Traffic Layer (Left Column) -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="280" height="585" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>
    <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="bold">[LAYER 1] MULTI-AGENT INGESTION</text>
    <text x="20" y="44" fill="#64748b" font-size="10">多智慧體請求接入與優先級標註 (100% 交付)</text>

    <!-- P0 Interactive -->
    <rect x="20" y="70" width="240" height="80" rx="8" fill="#0f172a" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="20" y="70" width="240" height="80" rx="8" fill="url(#grad-rose)"/>
    <text x="35" y="94" fill="#f43f5e" font-size="12" font-weight="bold">Priority 0: Interactive / Tools</text>
    <text x="35" y="110" fill="#cbd5e1" font-size="10">高優先級互動 / DSML 工具調用 (163/163 100%)</text>
    <text x="35" y="128" fill="#fda4af" font-size="9">• Adaptive 16.0s Window · Zero 10.0s Decapitation</text>
    <text x="35" y="140" fill="#94a3b8" font-size="8">• Dedicated Sacred Slot 8 · 0ms Fast Path</text>

    <!-- P1 Vision -->
    <rect x="20" y="170" width="240" height="80" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="20" y="170" width="240" height="80" rx="8" fill="url(#grad-violet)"/>
    <text x="35" y="194" fill="#c084fc" font-size="12" font-weight="bold">Priority 1: Multi-Turn Vision</text>
    <text x="35" y="210" fill="#cbd5e1" font-size="10">多輪讀圖跟隨 / Scratch Arena (499/499 100%)</text>
    <text x="35" y="228" fill="#d8b4fe" font-size="9">• SHA-256 Image Hash Prefix Fast Path</text>
    <text x="35" y="240" fill="#94a3b8" font-size="8">• 100.0% Turn 2 Hit Rate · 1.38M Cached Toks</text>

    <!-- P2 Background / Long Context -->
    <rect x="20" y="270" width="240" height="95" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="20" y="270" width="240" height="95" rx="8" fill="url(#grad-amber)"/>
    <text x="35" y="294" fill="#f59e0b" font-size="12" font-weight="bold">Priority 2: Background / Batch</text>
    <text x="35" y="310" fill="#cbd5e1" font-size="10">背景批次 / 22K 共享長文本任務 (171/171 100%)</text>
    <text x="35" y="328" fill="#fde68a" font-size="9">• 25.0s Tiered Queue (+8.0s Heavy Root Extension)</text>
    <text x="35" y="340" fill="#94a3b8" font-size="8">• Unblocked Slot 7 Steal: bg_max=7, zero starvation</text>
    <text x="35" y="352" fill="#34d399" font-size="8">• 100.0% Delivery (94 in P14 -> 171 in P15!)</text>

    <!-- Protocol Box -->
    <rect x="20" y="385" width="240" height="85" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="20" y="385" width="240" height="85" rx="8" fill="url(#grad-cyan)"/>
    <text x="35" y="409" fill="#22d3ee" font-size="11" font-weight="bold">DSML Protocol Interceptor</text>
    <text x="35" y="424" fill="#cbd5e1" font-size="10">DSML 協定安全轉譯與去膨脹</text>
    <text x="35" y="442" fill="#a5f3fc" font-size="9">• ensure_ascii=False (0% Chinese Bloat)</text>
    <text x="35" y="454" fill="#94a3b8" font-size="8">• Auto-rewrite tool_choice: required -> auto</text>

    <!-- Traffic Stats Mini Card -->
    <rect x="20" y="490" width="240" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="35" y="512" fill="#94a3b8" font-size="10" font-weight="bold">TRAFFIC OUTCOME (全場交付)</text>
    <text x="35" y="530" fill="#34d399" font-size="10" font-weight="bold">• 833 / 833 200 OK (100.00%)</text>
    <text x="35" y="546" fill="#38bdf8" font-size="9">• 0 HTTP 429 Drops (0.00%) · Zero OOM</text>
  </g>

  <!-- Connectors: Layer 1 to Layer 2 -->
  <path d="M 320 200 L 360 200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M 320 315 L 360 315" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Section 2: Reverse Proxy & Scheduling Layer (Middle Column) -->
  <g transform="translate(360, 85)">
    <rect x="0" y="0" width="360" height="585" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="bold">[LAYER 2] FAST-FAIL REVERSE PROXY (:8889)</text>
    <text x="20" y="44" fill="#64748b" font-size="10">智慧排隊、安全工作竊取與記憶體防護閘道</text>

    <!-- Slot State Visualizer -->
    <rect x="20" y="65" width="320" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="32" y="87" fill="#f8fafc" font-size="11" font-weight="bold">GPU EXECUTION SLOTS (8 並發槽位分配)</text>
    <text x="32" y="102" fill="#94a3b8" font-size="9">Optimal Erlang-Pooling Safe Work-Stealing Policy (bg_max=7)</text>

    <!-- Slots 1 to 6 (Standard) -->
    <g transform="translate(32, 115)">
      <rect x="0" y="0" width="180" height="42" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <text x="10" y="18" fill="#34d399" font-size="10" font-weight="bold">Slots 1 ~ 6: Standard</text>
      <text x="10" y="32" fill="#a7f3d0" font-size="8">All Priorities (P0 / P1 / P2)</text>
    </g>

    <!-- Slot 7 (Borrowable) -->
    <g transform="translate(220, 115)">
      <rect x="0" y="0" width="55" height="42" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="6" y="18" fill="#fbbf24" font-size="10" font-weight="bold">Slot 7</text>
      <text x="6" y="32" fill="#fde68a" font-size="8">P2 Steal</text>
    </g>

    <!-- Slot 8 (Sacred) -->
    <g transform="translate(283, 115)">
      <rect x="0" y="0" width="55" height="42" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="6" y="18" fill="#f43f5e" font-size="10" font-weight="bold">Slot 8</text>
      <text x="6" y="32" fill="#fda4af" font-size="8">Sacred</text>
    </g>

    <text x="32" y="178" fill="#34d399" font-size="8.5">• P2 borrows Slot 7 if no runnable urgent waiter exists</text>
    <text x="32" y="192" fill="#f43f5e" font-size="8.5">• Slot 8 strictly reserved for P0/P1 (Interactive SLA Guard)</text>
    <text x="32" y="206" fill="#38bdf8" font-size="8.5">• Little's Law Equilibrium: Client N=8 matches Server c=8 (0ms bloat)</text>

    <!-- Tiered Dynamic Queue Box -->
    <rect x="20" y="235" width="320" height="125" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="20" y="235" width="320" height="125" rx="8" fill="url(#grad-cyan)"/>
    <text x="32" y="258" fill="#38bdf8" font-size="11" font-weight="bold">Tiered Dynamic Queue (階梯排隊與防驚群)</text>
    <text x="32" y="274" fill="#e2e8f0" font-size="9.5">• Matrix: [25s, 22s, 19s, 16s, 13s, 10s, 7s, 4s]</text>
    <text x="32" y="290" fill="#e2e8f0" font-size="9.5">• Adaptive P0 Timeout: 14.0s ~ 16.0s (Protects Turn 2)</text>
    <text x="32" y="306" fill="#e2e8f0" font-size="9.5">• Heavy Root Extension: +8.0s for tokens > 12000, pos &lt;= 2</text>
    <text x="32" y="322" fill="#34d399" font-size="9">• Cache-Aware Waiter Promotion: 1-tier bump for warm prefixes</text>
    <text x="32" y="338" fill="#a5f3fc" font-size="8.5">• Zero Sunk-Cost: 100% of admitted requests successfully delivered</text>

    <!-- Dynamic Prefill Barrier -->
    <rect x="20" y="375" width="320" height="105" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="20" y="375" width="320" height="105" rx="8" fill="url(#grad-emerald)"/>
    <text x="32" y="398" fill="#34d399" font-size="11" font-weight="bold">Dynamic Prefill Barrier (3.05G 預填屏障)</text>
    <text x="32" y="414" fill="#e2e8f0" font-size="9.5">• Free RAM ≥ 3.05G: 3 Concurrent Large Prefills (>20K tokens)</text>
    <text x="32" y="430" fill="#e2e8f0" font-size="9.5">• 2.65G ≤ Free RAM &lt; 3.05G: 2 Concurrent Large Prefills</text>
    <text x="32" y="446" fill="#e2e8f0" font-size="9.5">• Warm Prefix Exemption: Clamped to 512 tokens (zero queue stall)</text>
    <text x="32" y="462" fill="#a7f3d0" font-size="8.5">• Prefill-Decode Overlap: Decrement on First Generated Token</text>

    <!-- SHM IPC Sync Box -->
    <rect x="20" y="495" width="320" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="32" y="516" fill="#94a3b8" font-size="10" font-weight="bold">SUB-MICROSECOND SHM IPC (:0.05µs)</text>
    <text x="32" y="532" fill="#e2e8f0" font-size="9">• Atomic Path: /dev/shm/dgx_cluster_state</text>
    <text x="32" y="548" fill="#cbd5e1" font-size="8.5">• State: active_running, waiting_in_queue, limit, timestamp</text>
  </g>

  <!-- Connectors: Layer 2 to Layer 3 -->
  <path d="M 720 180 L 760 180" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 720 440 L 760 440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Section 3: Distributed TP=2 Engine Layer (Right Column) -->
  <g transform="translate(760, 85)">
    <rect x="0" y="0" width="480" height="585" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-size="12" font-weight="bold">[LAYER 3] DISTRIBUTED TP=2 COMPUTE ENGINE (:8888)</text>
    <text x="20" y="44" fill="#64748b" font-size="10">雙節點 TensorFold Native Zig、2M KV 共享池與 MLA 解碼</text>

    <!-- Node 1: Head Rank 0 -->
    <rect x="20" y="65" width="440" height="125" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="20" y="65" width="440" height="125" rx="8" fill="url(#grad-cyan)"/>
    <text x="35" y="88" fill="#22d3ee" font-size="11" font-weight="bold">Node 1 (Head / Rank 0) · spark-9e5c · 10.100.184.2</text>
    <text x="35" y="104" fill="#e2e8f0" font-size="9.5">• Hardware: NVIDIA GB10 (128GB LPDDR5X UMA @ 273 GB/s)</text>
    <text x="35" y="120" fill="#e2e8f0" font-size="9.5">• Cache Memory: --prompt-cache-gib 2.5 (Snapshots in RAM)</text>
    <text x="35" y="136" fill="#e2e8f0" font-size="9.5">• NVMe Learn Imprint: --learn --learn-gib 32 (/cache/dsv41-nvme-imprint)</text>
    <text x="35" y="152" fill="#34d399" font-size="9" font-weight="bold">• Prompt Cache Hits: 9,566,208 Tokens (Record Breaking!)</text>
    <text x="35" y="168" fill="#34d399" font-size="9" font-weight="bold">• Free RAM: 3.20 ~ 3.50 GiB (Firmly above 2.80G Danger Line)</text>

    <!-- Node 2: Worker Rank 1 -->
    <rect x="20" y="205" width="440" height="105" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="20" y="205" width="440" height="105" rx="8" fill="url(#grad-violet)"/>
    <text x="35" y="228" fill="#c084fc" font-size="11" font-weight="bold">Node 2 (Worker / Rank 1) · spark-7579 · 10.100.184.1</text>
    <text x="35" y="244" fill="#e2e8f0" font-size="9.5">• Hardware: NVIDIA GB10 (128GB LPDDR5X UMA @ 273 GB/s)</text>
    <text x="35" y="260" fill="#e2e8f0" font-size="9.5">• Daemon: tf-dsv41-lanes (:29620) --pool 2097152 --streams 8</text>
    <text x="35" y="276" fill="#e2e8f0" font-size="9.5">• CPU Pinning: Cortex-X925 Pinned Cores 5-9, 15-19</text>
    <text x="35" y="292" fill="#34d399" font-size="9" font-weight="bold">• Free RAM: 5.60 ~ 6.00 GiB · Swap: 0 MB (Zero Paging)</text>

    <!-- RoCEv2 Interconnect Badge -->
    <rect x="20" y="325" width="440" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="346" fill="#38bdf8" font-size="11" font-weight="bold">CONNECTX-7 200G RoCEv2 DUAL INTERCONNECT</text>
    <text x="35" y="362" fill="#94a3b8" font-size="9">• 185 Gbps Throughput · GID 3 · All-Reduce Ring Latency &lt; 12.0µs · Zero Drops</text>

    <!-- MS-DTC Governor Box -->
    <rect x="20" y="395" width="440" height="170" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="20" y="395" width="440" height="170" rx="8" fill="url(#grad-amber)"/>
    <text x="35" y="418" fill="#fbbf24" font-size="11" font-weight="bold">MS-DTC DYNAMIC THERMAL GOVERNOR (動態溫控變速箱)</text>
    <text x="35" y="434" fill="#cbd5e1" font-size="10">Scale-Invariant Concurrency Governor (0.5s Period, STEP=50MHz)</text>
    <text x="35" y="452" fill="#fde68a" font-size="9">• Saturation Ratio: rho = min(1.0, (active + 0.5 * waiting) / c)</text>
    <text x="35" y="468" fill="#fde68a" font-size="9">• Adaptive Stepping: STEP=50MHz (Eliminated 150MHz Oscillations)</text>
    <text x="35" y="484" fill="#fde68a" font-size="9">• Soft Clamp: 2200 MHz at 89C Panic (Eliminated 1800MHz Drops)</text>
    <text x="35" y="500" fill="#fde68a" font-size="9">• Standby: 2400 MHz (9.4W) · Sweet-Zone Burst: 2500 MHz (T &lt; 84C)</text>
    <text x="35" y="516" fill="#34d399" font-size="9" font-weight="bold">• Generated Tokens: 279,583 Tokens (All-Time Record!)</text>
    <text x="35" y="532" fill="#a7f3d0" font-size="8.5">• Average Request Wall Duration: 30.63s (Faster than P11 baseline 31.10s!)</text>
  </g>
</svg>